<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留学选校智能助手</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
<script>
  const pdfjsLib = window['pdfjs-dist/build/pdf'];
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#0f0f14;--card:#1a1a24;--border:#2a2a3a;--text:#e0e0e8;--muted:#8888a0;--accent:#7c5cfc;--glow:rgba(124,92,252,0.3);--green:#34d399;--orange:#f59e0b;--red:#ef4444;--blue:#60a5fa;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
h1{font-size:1.6em;font-weight:700;background:linear-gradient(135deg,var(--accent),#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{padding:10px 22px;border:none;border-radius:8px;font-weight:600;cursor:pointer;transition:.2s;font-size:.9em}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 4px 16px var(--glow)}
.btn-primary:hover{transform:translateY(-1px)}
.btn-sec{background:var(--border);color:var(--text)}
.btn-sec:hover{background:#3a3a50}
.btn:disabled{opacity:.5;cursor:default}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flex{display:flex}.gap8{gap:8px}.wrap{flex-wrap:wrap}.center{align-items:center}.jcenter{justify-content:center}.between{justify-content:space-between}
.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}.mb24{margin-bottom:24px}.mt16{margin-top:16px}.p16{padding:16px}.p24{padding:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:.78em;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.form-group input,.form-group select{padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.9em;outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.form-group select[multiple]{min-height:100px}.form-group .hint{font-size:.7em;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tab{padding:8px 16px;cursor:pointer;border:none;background:none;color:var(--muted);font-size:.88em;border-radius:6px 6px 0 0}
.tab.active{color:var(--accent);background:var(--card);border:1px solid var(--border);border-bottom-color:var(--card)}
.tbl-wrap{overflow-x:auto;overflow-y:auto;border:1px solid var(--border);border-radius:8px;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:.82em;white-space:nowrap}
th{position:sticky;top:0;background:var(--card);color:var(--muted);padding:10px 8px;text-align:left;border-bottom:2px solid var(--border);z-index:1;font-weight:600;font-size:.8em}
td{padding:8px;border-bottom:1px solid #1f1f2a;color:var(--text)}
tr:hover td{background:rgba(124,92,252,.05)}
.badge{padding:2px 8px;border-radius:10px;font-size:.75em;font-weight:600}
.badge-safety{background:rgba(52,211,153,.12);color:var(--green)}
.badge-match{background:rgba(96,165,250,.12);color:var(--blue)}
.badge-reach{background:rgba(245,158,11,.12);color:var(--orange)}
.badge-lottery{background:rgba(239,68,68,.12);color:var(--red)}
.link{color:var(--accent);text-decoration:none;font-size:.8em}
.link:hover{text-decoration:underline}
.warn-box{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.25);border-radius:8px;padding:12px;font-size:.85em;color:var(--orange)}
.score{font-size:1.3em;font-weight:700}
.pass-text{color:var(--green)}
.stats-bar{display:flex;flex-wrap:wrap;gap:16px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:8px;font-size:.8em;color:var(--muted);margin-bottom:16px}
.stats-bar span{white-space:nowrap}.stats-bar strong{color:var(--text)}
@media(max-width:768px){.form-grid{grid-template-columns:1fr}}
</style>
<script src="js/programs.js"></script>
<script src="js/advisor.js"></script>
</head>
<body>
<div class="p24" style="max-width:1400px;margin:0 auto">
  <div class="flex center between mb24">
    <h1>留学选校智能助手</h1>
    <div style="font-size:.75em;color:var(--muted)">基于 QS + THE 2025 真实排名 · 全浏览器端运行</div>
  </div>

  <!-- 统计栏 -->
  <div class="stats-bar" id="statsBar"></div>

  <!-- API 配置区（可折叠） -->
  <div style="text-align:right;margin-bottom:8px">
    <button class="quick-btn" onclick="toggleApiConfig()" id="apiBtn" style="border-color:#7c5cfc;color:#7c5cfc;font-size:.78em">🔑 配置 API Key（可选·用于 AI 话术分析）</button>
    <span id="apiKeyStatus" style="font-size:.72em;color:var(--muted);margin-left:8px"></span>
  </div>
  <div id="apiConfig" class="card p16 mb16" style="display:none">
    <div class="form-grid">
      <div class="form-group" style="grid-column:span 2">
        <label>LLM API Key（可选）</label>
        <input type="password" id="apiKeyInput" placeholder="sk-..." style="font-family:monospace;font-size:.85em">
        <span class="hint">输入你的 DeepSeek/OpenAI Key，仅在浏览器本地存储，不会上传到任何服务器。用于 AI 简历评估和话术分析。</span>
      </div>
      <div class="form-group">
        <label>Base URL</label>
        <input type="url" id="apiBaseUrl" value="https://api.deepseek.com/v1">
      </div>
      <div class="form-group">
        <label>模型</label>
        <input type="text" id="apiModel" value="deepseek-chat">
      </div>
    </div>
    <div class="flex gap8 mt8">
      <button class="btn btn-sec" onclick="saveApiKey()" style="font-size:.8em">保存</button>
      <button class="btn btn-sec" onclick="clearApiKey()" style="font-size:.8em">清除</button>
    </div>
  </div>

  <div id="formSection">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('basic')">硬性条件</button>
      <button class="tab" onclick="switchTab('prefs')">偏好设置</button>
      <button class="tab" onclick="switchTab('bg')">软背景</button>
    </div>

    <form id="studentForm" onsubmit="submitForm(event)">
      <div id="tab-basic" class="card p24 mb16">
        <div class="form-grid">
          <div class="form-group"><label>GPA (4.0)</label><input type="number" id="gpa" min="2.0" max="4.0" step="0.1" value="3.2" required></div>
          <div class="form-group"><label>语言类型</label><select id="lang_type"><option value="IELTS">IELTS</option><option value="TOEFL">TOEFL</option></select></div>
          <div class="form-group"><label id="lang_label">IELTS</label><input type="number" id="lang_score" min="5.0" max="9.0" step="0.5" value="7.0" required></div>
          <div class="form-group"><label>GRE (留空=未考)</label><input type="number" id="gre" min="260" max="340" placeholder="留空" value=""></div>
          <div class="form-group"><label>总预算 USD</label><input type="number" id="budget" min="10000" max="300000" step="1000" value="150000" required></div>
          <div class="form-group"><label>最低排名 (0=不限)</label><input type="number" id="min_rank" min="0" max="500" value="50"></div>
          <div class="form-group" style="grid-column:span 2">
            <label>上传成绩单（PDF/Excel）← 自动按 WES 标准换算 GPA</label>
            <input type="file" id="transcriptFile" accept=".pdf,.xlsx,.xls" onchange="uploadTranscript()" style="padding:6px;font-size:.85em">
            <span id="transcriptStatus" style="font-size:.75em;color:var(--muted)">上传后 AI 按 WES 标准提取课程并换算成 4.0  GPA</span>
          </div>
        </div>
      </div>

      <div id="tab-prefs" class="card p24 mb16" style="display:none">
        <div class="form-grid">
          <div class="form-group"><label>安全偏好</label><select id="safety_pref"><option value="medium">中等</option><option value="high">高</option><option value="low">低</option></select></div>
          <div class="form-group"><label>职业目标</label><select id="career_goal"><option value="stay_abroad">留在国外</option><option value="return_china">回国</option><option value="startup">创业</option></select></div>
          <div class="form-group"><label>签证友好 (OPT/PSW)</label><select id="visa_friendly"><option value="true">是</option><option value="false">否</option></select></div>
        </div>
      </div>

      <div id="tab-bg" class="card p24 mb16" style="display:none">
        <div class="form-grid" style="grid-template-columns:1fr 1fr">
          <div class="form-group"><label>研究/项目经历</label><select id="research" multiple size="4">
            <option value="machine learning">ML</option><option value="deep learning">DL</option><option value="NLP">NLP</option>
            <option value="CV">CV</option><option value="data mining">数据挖掘</option><option value="fintech">金融科技</option>
            <option value="quantum">量子计算</option><option value="blockchain">区块链</option>
          </select></div>
          <div class="form-group"><label>工作/实习经历</label><select id="work" multiple size="4">
            <option value="internship at Google">Google实习</option><option value="research assistant">科研助理</option>
            <option value="open source contributor">开源贡献</option><option value="published paper">发表论文</option>
            <option value="startup founder">创业</option><option value="accounting internship">会计实习</option>
          </select></div>
          <div class="form-group" style="grid-column:span 2"><label>已修先修课</label><select id="prerequisites" multiple size="4">
            <option value="Calculus I-II">微积分</option><option value="Linear Algebra">线性代数</option>
            <option value="Probability & Statistics">概率统计</option><option value="Statistics">统计</option>
            <option value="Discrete Mathematics">离散数学</option><option value="Programming (Python)">Python</option>
            <option value="Database Systems">数据库</option><option value="Microeconomics">微观经济学</option>
            <option value="Macroeconomics">宏观经济学</option><option value="Financial Accounting">会计</option>
            <option value="Corporate Finance">公司金融</option><option value="Econometrics">计量经济学</option>
          </select></div>
          <div class="form-group" style="grid-column:span 2">
            <label>上传简历（PDF/DOCX/TXT）</label>
            <input type="file" id="resumeFile" accept=".pdf,.docx,.txt" onchange="uploadResume()" style="padding:6px;font-size:.85em">
            <span id="resumeStatus" style="font-size:.75em;color:var(--muted)">上传后 AI 自动分析并填充背景</span>
          </div>
          <div class="form-group" style="grid-column:span 2">
            <label>或直接粘贴简历文本（可选）</label>
            <textarea id="resumeText" rows="6" style="background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.85em;padding:8px;resize:vertical;font-family:monospace" placeholder="粘贴你的简历内容在这里，点击下方按钮让 AI 分析..."></textarea>
            <div class="flex gap8 mt8">
              <button type="button" class="btn btn-sec" onclick="analyzeResumeText()" style="font-size:.8em" id="analyzeResumeBtn">🤖 AI 分析简历</button>
              <span id="resumeAnalyzeStatus" style="font-size:.75em;color:var(--muted);align-self:center"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="flex gap8 mt16 mb16">
        <button type="submit" class="btn btn-primary" id="submitBtn">开始智能选校</button>
        <button type="button" class="btn btn-sec" onclick="resetForm()">重置</button>
      </div>
    </form>
    <div id="loading" style="display:none;text-align:center;padding:32px">
      <div class="spinner" style="margin:0 auto;width:24px;height:24px"></div>
      <p style="margin-top:8px;color:var(--muted)">正在分析 2,423 条专业数据...</p>
    </div>
  </div>

  <div id="results" style="display:none">
    <div id="bgAnalysis"></div>
    <div id="recommendationStats" class="flex between center mb8" style="padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:8px"></div>
    <div id="resultTable" class="mb16"></div>
    <div class="flex center mb16">
      <button class="btn btn-sec" onclick="backToForm()">← 返回修改条件</button>
    </div>
  </div>
</div>

<script>
// ─── 数据 ───────────────────────────
const W = { gpa: 28, language: 17, gre: 12, background: 15, prerequisite: 15, extra: 6, competitiveness: 7 };

// ─── 初始化 ──────────────────────────
document.getElementById('lang_type').addEventListener('change', function() {
  const s = document.getElementById('lang_score'), l = document.getElementById('lang_label');
  if (this.value === 'IELTS') { s.min = 5; s.max = 9; s.step = 0.5; s.value = 7; l.textContent = 'IELTS'; }
  else { s.min = 60; s.max = 120; s.step = 1; s.value = 100; l.textContent = 'TOEFL'; }
});

function switchTab(t) {
  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('[id^="tab-"]').forEach(d => d.style.display = 'none');
  document.getElementById('tab-' + t).style.display = '';
}

function getVal(id) { return document.getElementById(id).value; }
function getSel(id) { return Array.from(document.getElementById(id).selectedOptions).map(o => o.value); }

// ─── 统计栏 ──────────────────────────
function showStats() {
  const countries = new Set(PROGRAMS.map(p => p.c));
  const majors = new Set(PROGRAMS.map(p => p.m));
  const top10 = PROGRAMS.filter(p => parseInt(p.r) <= 10);
  const us = PROGRAMS.filter(p => p.c === 'United States');
  document.getElementById('statsBar').innerHTML = `
    <span>📚 <strong>${PROGRAMS.length}</strong> 条专业</span>
    <span>🏛️ <strong>${countries.size}</strong> 个国家</span>
    <span>🎯 <strong>${majors.size}</strong> 个方向</span>
    <span>🏆 <strong>${new Set(top10.map(p => p.u)).size}</strong> 所 Top 10 院校</span>
    <span>🇺🇸 <strong>${new Set(us.map(p => p.u)).size}</strong> 所美国大学</span>
    <span>💰 含学费/生活费/录取率/GPA要求/签证时长</span>
  `;
}

document.addEventListener('DOMContentLoaded', function() {
  showStats();
  loadApiKey();
});

// ─── API Key 管理 ────────────────────
function toggleApiConfig() {
  const el = document.getElementById('apiConfig');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function loadApiKey() {
  const key = localStorage.getItem('llm_api_key') || '';
  const baseUrl = localStorage.getItem('llm_base_url') || 'https://api.deepseek.com/v1';
  const model = localStorage.getItem('llm_model') || 'deepseek-chat';
  document.getElementById('apiKeyInput').value = key;
  document.getElementById('apiBaseUrl').value = baseUrl;
  document.getElementById('apiModel').value = model;
  updateApiKeyStatus();
}

function saveApiKey() {
  const key = document.getElementById('apiKeyInput').value.trim();
  const baseUrl = document.getElementById('apiBaseUrl').value.trim();
  const model = document.getElementById('apiModel').value.trim();
  if (key) localStorage.setItem('llm_api_key', key);
  if (baseUrl) localStorage.setItem('llm_base_url', baseUrl);
  if (model) localStorage.setItem('llm_model', model);
  updateApiKeyStatus();
  alert('✅ API Key 已保存到浏览器本地（localStorage）');
}

function clearApiKey() {
  localStorage.removeItem('llm_api_key');
  localStorage.removeItem('llm_base_url');
  localStorage.removeItem('llm_model');
  document.getElementById('apiKeyInput').value = '';
  updateApiKeyStatus();
  alert('已清除 API Key');
}

function updateApiKeyStatus() {
  const key = localStorage.getItem('llm_api_key') || '';
  const el = document.getElementById('apiKeyStatus');
  el.innerHTML = key ? '✅ Key 已配置' : '';
}

// ─── LLM 背景评估 ────────────────────
async function llmBackgroundAnalysis(profile) {
  const apiKey = localStorage.getItem('llm_api_key');
  if (!apiKey) return null;

  const baseUrl = localStorage.getItem('llm_base_url') || 'https://api.deepseek.com/v1';
  const model = localStorage.getItem('llm_model') || 'deepseek-chat';
  const bg = profile.soft_background || {};
  const research = bg.research || [];
  const work = bg.work_experience || [];
  const resumeText = profile._resume_text || '';
  const resumeParsed = profile._resume_extracted;

  // 如果既没有选择项也没有粘贴简历，跳过
  if (!research.length && !work.length && !resumeText) return null;

  let parts = [];
  if (resumeText) {
    // 有完整简历文本，让 LLM 做全面评估
    parts.push('=== 简历原文 ===\n' + resumeText.substring(0, 2000));
    if (resumeParsed) {
      if (resumeParsed.education?.length) parts.push('\n=== 教育背景 ===\n' + JSON.stringify(resumeParsed.education, null, 2));
      if (resumeParsed.work_experience?.length) parts.push('\n=== 工作经历 ===\n' + JSON.stringify(resumeParsed.work_experience, null, 2));
      if (resumeParsed.skills?.length) parts.push('\n=== 技能 ===\n' + resumeParsed.skills.join(', '));
      if (resumeParsed.projects?.length) parts.push('\n=== 项目 ===\n' + JSON.stringify(resumeParsed.projects, null, 2));
    }
    parts.push(`\nGPA: ${profile.gpa || 'N/A'}`);
    const lang = profile.language || {};
    if (lang.score) parts.push(`${lang.type}: ${lang.score}`);
  } else {
    if (research.length) parts.push(`Research/Projects: ${research.join(', ')}`);
    if (work.length) parts.push(`Work Experience: ${work.join(', ')}`);
    parts.push(`GPA: ${profile.gpa || 'N/A'}`);
    const lang = profile.language || {};
    if (lang.score) parts.push(`${lang.type}: ${lang.score}`);
  }

  try {
    const resp = await fetch(baseUrl + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
      body: JSON.stringify({
        model: model,
        messages: [
          { role: 'system', content: '你是留学申请评审专家。用中文写分析话术，先打分再写分析。' },
          { role: 'user', content:
            '评估以下申请者的背景（0-10分），写出 2-4 句中文分析话术，指出优点/不足/改进建议。\n\n'
            + parts.join('\n') + '\n\n格式：\nScore: X.X\n分析：你的分析文字...' }
        ],
        max_tokens: 300,
        temperature: 0.7,
      })
    });
    const data = await resp.json();
    const text = data.choices?.[0]?.message?.content || '';
    
    // 提取分数和分析
    const nums = text.match(/(\d+(?:\.\d+)?)/);
    let analysis = '';
    const zhMatch = text.match(/分析[：:]\s*(.+?)(?:\n\n|$)/s);
    if (zhMatch) analysis = zhMatch[1].trim();
    else {
      const lines = text.split('\n');
      let inAnalysis = false;
      for (const line of lines) {
        if (line.includes('分析') && (line.includes('：') || line.includes(':'))) {
          inAnalysis = true;
          const rest = line.replace(/^.*?分析[：:]\s*/, '');
          if (rest) analysis = rest;
        } else if (inAnalysis && line.trim()) {
          analysis += ' ' + line.trim();
        }
      }
    }
    return { score: nums ? parseFloat(nums[0]) : null, text: analysis || text };
  } catch(e) {
    console.warn('LLM eval failed:', e);
    return null;
  }
}

// ─── AI 分析简历文本 ─────────────────
async function analyzeResumeText() {
  const apiKey = localStorage.getItem('llm_api_key');
  if (!apiKey) { alert('请先在 🔑 API 设置中配置你的 API Key'); return; }

  const text = document.getElementById('resumeText').value.trim();
  if (!text || text.length < 20) { alert('请粘贴至少 20 个字符的简历文本'); return; }

  const btn = document.getElementById('analyzeResumeBtn');
  const status = document.getElementById('resumeAnalyzeStatus');
  btn.disabled = true; status.textContent = 'AI 分析中...';

  const baseUrl = localStorage.getItem('llm_base_url') || 'https://api.deepseek.com/v1';
  const model = localStorage.getItem('llm_model') || 'deepseek-chat';

  try {
    const resp = await fetch(baseUrl + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
      body: JSON.stringify({
        model: model,
        messages: [
          { role: 'system', content: 'You are a resume parser. Extract structured info from the resume text below and output ONLY a JSON object with these fields (use empty arrays if none): education (array of {degree, major, university, gpa}), work_experience (array of {position, company, duration, description}), skills (array of strings), projects (array of {name, description, technologies}), certifications (array of strings). Do not include any other text.' },
          { role: 'user', content: text.substring(0, 4000) }
        ],
        max_tokens: 1000,
        temperature: 0.1,
      })
    });
    const data = await resp.json();
    const content = data.choices?.[0]?.message?.content || '';

    // 尝试解析 JSON
    const jsonMatch = content.match(/\{[\s\S]*\}/);
    if (!jsonMatch) { alert('AI 返回格式异常，请重试'); console.error(content); return; }
    const parsed = JSON.parse(jsonMatch[0]);

    // 自动填充表单
    let fillMsg = [];

    // GPA
    if (parsed.education && parsed.education.length) {
      const lastEdu = parsed.education[parsed.education.length - 1];
      if (lastEdu.gpa) {
        const g = parseFloat(lastEdu.gpa);
        if (!isNaN(g) && g >= 2.0 && g <= 4.0) {
          document.getElementById('gpa').value = g;
          fillMsg.push('GPA → ' + g);
        }
      }
    }

    // 工作经历
    if (parsed.work_experience && parsed.work_experience.length) {
      const names = parsed.work_experience.map(w => w.position || w.company || '').filter(Boolean);
      const sel = document.getElementById('work');
      // 模糊匹配列表中的选项
      names.forEach(name => {
        const n = name.toLowerCase();
        Array.from(sel.options).forEach(o => {
          if (n.includes(o.value.toLowerCase().replace(/[^a-z]/g, ''))) o.selected = true;
          if (o.value.toLowerCase().includes(n.replace(/[^a-z]/g, ''))) o.selected = true;
        });
      });
      fillMsg.push('工作经历已部分填充');
    }

    // 技能 → 尝试匹配到研究经历
    if (parsed.skills && parsed.skills.length) {
      const skillText = parsed.skills.join(' ');
      const sel = document.getElementById('research');
      Array.from(sel.options).forEach(o => {
        if (skillText.toLowerCase().includes(o.value.toLowerCase())) o.selected = true;
      });
      fillMsg.push('技能已匹配到研究/项目领域');
    }

    // 同时保存原始提取结果供提交时 LLM 评估使用
    window._resumeExtracted = parsed;

    status.textContent = '✅ 分析完成！' + fillMsg.join('、');
    setTimeout(() => { status.textContent = ''; }, 3000);
  } catch(e) {
    status.textContent = '❌ 分析失败: ' + e.message;
  }
  btn.disabled = false;
}

// ─── 上传成绩单 ──────────────────────
async function uploadTranscript() {
  const file = document.getElementById('transcriptFile').files[0];
  if (!file) return;
  const apiKey = localStorage.getItem('llm_api_key');
  if (!apiKey) { alert('请先在 🔑 API 设置中配置 API Key'); return; }

  const status = document.getElementById('transcriptStatus');
  status.textContent = '⏳ 正在解析成绩单...';

  try {
    let text = '';
    if (file.name.endsWith('.pdf')) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      for (let i = 1; i <= Math.min(pdf.numPages, 10); i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(' ') + '\n';
      }
    } else {
      // xlsx/xls - 读取为文本
      text = await file.text();
    }

    if (text.trim().length < 20) { status.textContent = '❌ 未能提取有效文本'; return; }

    // 调用 LLM 提取课程并按 WES 标准换算 GPA
    const baseUrl = localStorage.getItem('llm_base_url') || 'https://api.deepseek.com/v1';
    const model = localStorage.getItem('llm_model') || 'deepseek-chat';
    const resp = await fetch(baseUrl + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
      body: JSON.stringify({
        model, max_tokens: 800, temperature: 0.1,
        messages: [
          { role: 'system', content: '你是一名留学成绩单评估专家。从成绩单文本中提取课程名称和原始成绩（百分制/五分制/等级制），然后按 WES（World Education Services）中国标准换算为 4.0 GPA。只输出 JSON，不要其他内容。' },
          { role: 'user', content: `从以下成绩单文本中提取所有课程名称和成绩，然后按 WES 标准（中国大学）换算成 4.0 GPA。

WES 换算规则（中国大学）：
- 90-100 → 4.0 (A)
- 85-89 → 3.7 (A-)  
- 82-84 → 3.3 (B+)
- 78-81 → 3.0 (B)
- 75-77 → 2.7 (B-)
- 72-74 → 2.3 (C+)
- 68-71 → 2.0 (C)
- 65-67 → 1.7 (C-)
- 62-64 → 1.3 (D+)
- 60-61 → 1.0 (D)
- <60  → 0.0 (F)

输出 JSON 格式：
{
  "original_gpa": 中国原始平均分（如 85.5）,
  "wes_gpa": WES换算后的4.0 GPA（如 3.5）,
  "courses": ["Calculus I-II", "Linear Algebra", ...],
  "course_count": 课程总数,
  "wes_note": "根据你的成绩单，WES 换算后 GPA 为 X.X/4.0"
}

成绩单文本：
${text.substring(0, 4000)}` }
        ]
      })
    });
    const data = await resp.json();
    const content = data.choices?.[0]?.message?.content || '';
    const jsonMatch = content.match(/\{[\s\S]*\}/);
    if (!jsonMatch) { status.textContent = '❌ AI 解析异常'; return; }
    const parsed = JSON.parse(jsonMatch[0]);

    let msgs = [];
    // 填充 WES 换算后的 GPA
    const wesGpa = parsed.wes_gpa || parsed.gpa;
    if (wesGpa) {
      const g = parseFloat(wesGpa);
      if (!isNaN(g) && g >= 2.0 && g <= 4.0) {
        document.getElementById('gpa').value = g;
        msgs.push('WES GPA → ' + g.toFixed(2));
      }
    }
    // 显示 WES 备注
    if (parsed.wes_note) msgs.push('📝 ' + parsed.wes_note);
    // 填充先修课
    if (parsed.courses && parsed.courses.length) {
      const sel = document.getElementById('prerequisites');
      parsed.courses.forEach(c => {
        const cl = c.toLowerCase();
        Array.from(sel.options).forEach(o => {
          if (cl.includes(o.value.toLowerCase().replace(/[^a-z0-9]/g, '').substring(0, 6))) o.selected = true;
        });
      });
      msgs.push('课程 ' + parsed.courses.length + ' 门已匹配');
    }
    status.textContent = '✅ ' + msgs.join('、');
    setTimeout(() => { status.textContent = '上传后 AI 自动提取课程与 GPA'; }, 5000);
  } catch(e) {
    status.textContent = '❌ 解析失败: ' + e.message;
  }
}

// ─── 上传简历 ──────────────────────
async function uploadResume() {
  const file = document.getElementById('resumeFile').files[0];
  if (!file) return;
  const apiKey = localStorage.getItem('llm_api_key');
  if (!apiKey) { alert('请先在 🔑 API 设置中配置 API Key'); return; }

  const status = document.getElementById('resumeStatus');
  status.textContent = '⏳ 正在解析简历...';

  try {
    let text = '';
    const ext = file.name.split('.').pop().toLowerCase();

    if (ext === 'pdf') {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      for (let i = 1; i <= Math.min(pdf.numPages, 10); i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(' ') + '\n';
      }
    } else if (ext === 'docx') {
      // docx: 用 JSZip 读取纯文本
      const arrayBuffer = await file.arrayBuffer();
      const zip = new JSZip();
      await zip.loadAsync(arrayBuffer);
      const doc = await zip.file('word/document.xml').async('text');
      const parser = new DOMParser();
      const xml = parser.parseFromString(doc, 'text/xml');
      const texts = xml.evaluate('//w:t', xml, null, XPathResult.ANY_TYPE, null);
      let t;
      while ((t = texts.iterateNext())) text += t.textContent + ' ';
    } else {
      text = await file.text();
    }

    if (text.trim().length < 20) { status.textContent = '❌ 未能提取有效文本'; return; }

    // 把提取的文本填入 textarea 并触发 AI 分析
    document.getElementById('resumeText').value = text;
    status.textContent = '✅ 文本已提取，正在 AI 分析...';
    await analyzeResumeText();
    status.textContent = '✅ 简历解析完成！已自动填充表单';
    setTimeout(() => { status.textContent = '上传后 AI 自动分析并填充背景'; }, 5000);
  } catch(e) {
    status.textContent = '❌ 解析失败: ' + e.message;
  }
}

// ─── 提交 ────────────────────────────
function buildProfile() {
  const bg = { research: getSel('research'), work_experience: getSel('work'), hobbies: [] };
  const resumeText = document.getElementById('resumeText').value.trim();
  return {
    gpa: parseFloat(getVal('gpa')),
    language: { type: getVal('lang_type'), score: parseFloat(getVal('lang_score')) },
    gre: getVal('gre') ? parseInt(getVal('gre')) : null,
    budget: { total_usd: parseInt(getVal('budget')), prefer_scholarship: true },
    safety_preference: getVal('safety_pref'),
    career_goal: getVal('career_goal'),
    visa_friendly_required: getVal('visa_friendly') === 'true',
    min_rank: parseInt(getVal('min_rank')) || 0,
    exclude_universities: [],
    soft_background: bg,
    completed_prerequisites: getSel('prerequisites'),
    _resume_text: resumeText || null,
    _resume_extracted: window._resumeExtracted || null,
  };
}

function renderRecommendation(rec) {
  const levelMap = { safety: '保底', match: '匹配', reach: '冲刺', lottery: '彩票' };
  const badgeMap = { safety: 'badge-safety', match: 'badge-match', reach: 'badge-reach', lottery: 'badge-lottery' };
  const cost = rec.costBreakdown || {};
  const req = rec.requirements || {};
  const langReq = req.minIelts ? 'IELTS≥' + req.minIelts : ('TOEFL≥' + (req.minToefl || ''));
  const missing = (rec.prerequisiteMissing || []).join(', ');
  // 有先修课数据就显示，没有则给出官网链接供自查
  const hasPrereqData = rec.prerequisiteMissing && rec.prerequisiteMissing.length > 0;
  const prereqCell = hasPrereqData
    ? `<span style="font-size:.78em;color:var(--muted)" title="${missing}">${missing}</span>`
    : `<a class="link" href="${rec.programUrl || '#'}" target="_blank" title="查看官网先修课要求">查看官网→</a>`;
  return `<tr>
    <td><span class="badge ${badgeMap[rec.feasibilityLevel] || ''}">${levelMap[rec.feasibilityLevel] || rec.feasibilityLevel}</span></td>
    <td>${rec.university}</td>
    <td>${rec.major}</td>
    <td><strong>${rec.matchScore}</strong></td>
    <td>${rec.admitRate}%</td>
    <td>$${(cost.tuitionPerYear || 0).toLocaleString()}</td>
    <td>$${(cost.livingPerYear || 0).toLocaleString()}</td>
    <td>$${(cost.total2years || 0).toLocaleString()}</td>
    <td>${rec.visaSupport}</td>
    <td>建议≥${req.recommendedGpa || ''}</td>
    <td>${langReq}</td>
    <td>${req.greRequired || '—'}</td>
    <td>${prereqCell}</td>
    <td><a class="link" href="${rec.programUrl || '#'}" target="_blank">🏠 官网</a></td>
  </tr>`;
}

async function submitForm(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>分析中';
  document.getElementById('loading').style.display = 'block';
  document.getElementById('results').style.display = 'none';

  // 用微任务让 UI 先更新
  await new Promise(r => setTimeout(r, 50));

  try {
    const profile = buildProfile();
    
    // 阶段1: LLM 背景评估（如果配置了 API Key）
    let bgHtml = '';
    const llmResult = await llmBackgroundAnalysis(profile);
    if (llmResult && llmResult.text) {
      bgHtml = `<div class="card p16 mb16" style="border-left:3px solid var(--accent)">
        <div style="font-size:.8em;color:var(--muted);margin-bottom:4px">🤖 AI 背景评估</div>
        <div style="color:var(--text);font-size:.9em;line-height:1.6">${llmResult.text.replace(/\n/g, '<br>')}</div>
        ${llmResult.score ? `<div style="margin-top:6px;font-size:.78em;color:var(--muted)">综合评分: ${llmResult.score}/10</div>` : ''}
      </div>`;
    }
    document.getElementById('bgAnalysis').innerHTML = bgHtml;
    
    // 阶段2: 核心推荐
    const recs = Advisor.recommend(PROGRAMS, profile);

    if (!recs.length) {
      document.getElementById('resultTable').innerHTML =
        '<div class="warn-box">没有找到符合条件的推荐。尝试放宽排名/预算限制，或降低安全偏好。</div>';
      document.getElementById('recommendationStats').innerHTML = '';
    } else {
      const levels = {};
      recs.forEach(r => { levels[r.feasibilityLevel] = (levels[r.feasibilityLevel] || 0) + 1; });
      const levelStr = Object.entries(levels).map(([k, v]) => {
        const names = { safety: '保底', match: '匹配', reach: '冲刺', lottery: '彩票' };
        return `${names[k] || k}: ${v}`;
      }).join(' | ');

      document.getElementById('recommendationStats').innerHTML = `
        <span><strong>${recs.length}</strong> 个推荐</span>
        <span>${levelStr}</span>
      `;

      let html = '<div class="tbl-wrap"><table><thead><tr>' +
        '<th>层级</th><th>院校</th><th>专业</th><th>匹配分</th><th>录取率</th>' +
        '<th>学费/年</th><th>生活费/年</th><th>总花费</th>' +
        '<th>签证</th><th>GPA</th><th>语言</th><th>GRE</th><th>缺先修课</th><th>官网</th>' +
        '</tr></thead><tbody>';
      html += recs.map(r => renderRecommendation(r)).join('');
      html += '</tbody></table></div>';
      document.getElementById('resultTable').innerHTML = html;
    }
  } catch(e) {
    document.getElementById('resultTable').innerHTML =
      '<div class="warn-box">出错了: ' + e.message + '</div>';
  }

  document.getElementById('formSection').style.display = 'none';
  document.getElementById('results').style.display = 'block';
  btn.disabled = false; btn.innerHTML = '开始智能选校';
  document.getElementById('loading').style.display = 'none';
  window.scrollTo(0, 0);
}

function backToForm() {
  document.getElementById('formSection').style.display = 'block';
  document.getElementById('results').style.display = 'none';
  window.scrollTo(0, 0);
}

function resetForm() {
  document.getElementById('studentForm').reset();
  document.getElementById('gpa').value = 3.2;
  document.getElementById('lang_score').value = 7;
  document.getElementById('budget').value = 150000;
}
